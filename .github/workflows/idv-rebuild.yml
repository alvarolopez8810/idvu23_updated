name: IDV Rebuild Historical Data

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Fecha de inicio de la reconstruccion (YYYY-MM-DD)'
        required: true
        default: '2026-01-01'
      end_date:
        description: 'Fecha de fin (YYYY-MM-DD, dejar vacio = hoy)'
        required: false
        default: ''
      tournament_ids:
        description: 'IDs de torneos separados por coma (vacio = todos)'
        required: false
        default: ''
      week_size_days:
        description: 'Dias por chunk de scraping (recomendado: 7)'
        required: false
        default: '7'

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 horas — suficiente para reconstruir desde enero

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Verificar Chrome
        run: google-chrome --version || chromium --version

      # -----------------------------------------------------------------------
      # Iterar semana a semana desde start_date hasta end_date
      # El script Python gestiona la iteración para mayor robustez
      # -----------------------------------------------------------------------
      - name: Reconstruir acumulado semana a semana
        env:
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
          TOURNAMENT_IDS: ${{ github.event.inputs.tournament_ids }}
          WEEK_SIZE: ${{ github.event.inputs.week_size_days }}
        run: |
          python scripts/1_scraping/rebuild_acumulado.py \
            --start "$START_DATE" \
            --end "${END_DATE:-$(date +%Y-%m-%d)}" \
            --week-size "$WEEK_SIZE" \
            $( [ -n "$TOURNAMENT_IDS" ] && echo "--tournaments $TOURNAMENT_IDS" )

      # -----------------------------------------------------------------------
      # Commit del acumulado reconstruido
      # -----------------------------------------------------------------------
      - name: Commit acumulado reconstruido
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jugadores_acumulado.csv
          git diff --cached --quiet || git commit -m \
            "datos: reconstruccion historico ${{ github.event.inputs.start_date }} a ${END_DATE:-hoy} [skip ci]"
          git push || true

      # -----------------------------------------------------------------------
      # Subir acumulado como artefacto (backup adicional)
      # -----------------------------------------------------------------------
      - name: Subir acumulado como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: IDV-acumulado-rebuild-${{ github.event.inputs.start_date }}
          path: data/jugadores_acumulado.csv
          retention-days: 90
          if-no-files-found: warn
